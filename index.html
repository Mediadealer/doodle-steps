<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Doodle Steps</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Doodle Steps">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#fff8ec">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>

  <!-- Home: pick a picture -->
  <main id="home" class="home">
    <header class="home-head">
      <h1><span>Doodle</span> <span>Steps</span></h1>
      <p>Pick a picture. Color one shape at a time.</p>
      <button id="raceBtn" class="btn race-btn">Race a friend</button>
    </header>
    <div id="cards" class="cards"></div>
  </main>

  <!-- Draw screen -->
  <main id="draw" class="draw" hidden>
    <div class="topbar">
      <button id="homeBtn" class="btn round" aria-label="Back to pictures">←</button>
      <div id="dots" class="dots"></div>
      <button id="restartBtn" class="btn round" aria-label="Start this picture over">↺</button>
      <button id="soundBtn" class="btn round" aria-label="Sound on or off">♪</button>
    </div>

    <div id="raceStrip" class="race-strip" hidden>
      <div class="lane me"><span>You</span><div class="bar"><i id="myBar"></i></div><b id="myCount"></b></div>
      <div class="lane them"><span id="themName">Friend</span><div class="bar"><i id="themBar"></i></div><b id="themCount"></b></div>
    </div>

    <div class="work">
      <div id="stage" class="stage">
        <canvas id="paper" width="900" height="900"></canvas>
        <canvas id="ink" width="900" height="900"></canvas>
        <canvas id="guide" width="900" height="900"></canvas>
        <div id="pop" class="pop" hidden></div>
      </div>

      <aside class="panel">
        <div class="ref">
          <div id="refPic" class="ref-pic"></div>
          <div class="step-card">
            <div id="stepCount" class="step-count"></div>
            <div class="step-name"><i id="swatch" class="swatch"></i><span id="stepName"></span></div>
            <div id="stepHint" class="step-hint"></div>
          </div>
        </div>

        <div id="brushes" class="brushes" role="group" aria-label="Brush size"></div>

        <div class="tools">
          <button id="undoBtn" class="btn">↶ Undo</button>
          <button id="eraseBtn" class="btn">Eraser</button>
          <button id="clearBtn" class="btn">Clear</button>
        </div>

        <button id="nextBtn" class="btn next" disabled><span id="nextLabel">Keep going!</span></button>
      </aside>
    </div>
  </main>

  <!-- Finished -->
  <div id="finish" class="finish" hidden>
    <div id="confetti" class="confetti"></div>
    <div class="finish-card">
      <h2 id="finishTitle">You did it!</h2>
      <p id="raceResult" class="race-result" hidden></p>
      <div class="compare">
        <figure>
          <img id="finalPic" alt="Your finished drawing">
          <figcaption>Yours</figcaption>
        </figure>
        <figure id="theirFig" hidden>
          <img id="theirPic" alt="Your friend's drawing" hidden>
          <div id="theirWait" class="orig waiting">Still drawing…</div>
          <figcaption id="theirCap">Friend</figcaption>
        </figure>
        <figure>
          <div id="origPic" class="orig"></div>
          <figcaption>Original</figcaption>
        </figure>
      </div>
      <div id="finalStars" class="final-stars"></div>
      <div class="finish-btns">
        <button id="saveBtn" class="btn">Save picture</button>
        <button id="againBtn" class="btn">Draw again</button>
        <button id="raceAgainBtn" class="btn" hidden>Race again</button>
        <button id="moreBtn" class="btn next ready">More pictures</button>
      </div>
    </div>
  </div>

  <!-- Race a friend -->
  <div id="race" class="finish" hidden>
    <div class="finish-card race-card">
      <button id="raceClose" class="btn round race-close" aria-label="Close">✕</button>
      <h2>Race a friend</h2>

      <div id="raceMenu">
        <label class="field">Your name
          <input id="raceName" type="text" maxlength="12" autocomplete="off" placeholder="Player">
        </label>
        <div class="race-choices">
          <div class="choice">
            <button id="hostBtn" class="btn next ready">Start a race</button>
            <p>You get a code to share with your friend.</p>
          </div>
          <div class="choice">
            <input id="codeIn" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Race code">
            <button id="joinBtn" class="btn">Join a race</button>
            <p>Type the code your friend gives you.</p>
          </div>
        </div>
      </div>

      <div id="raceHost" hidden>
        <p class="code-label">Your race code</p>
        <div id="raceCode" class="race-code">····</div>
        <p id="hostStatus" class="race-status" role="status"></p>
        <p class="code-label">Pick the picture to race on</p>
        <div id="racePicker" class="race-picker"></div>
        <button id="startRaceBtn" class="btn next" disabled>Start the race</button>
      </div>

      <div id="raceGuest" hidden>
        <p id="guestStatus" class="race-status" role="status"></p>
        <div id="guestPic" class="guest-pic"></div>
        <p id="guestPicName" class="code-label"></p>
      </div>
    </div>
  </div>

  <div id="count" class="count" hidden></div>
  <div id="toast" class="toast" hidden role="status"></div>

  <svg id="measure" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

  <script src="lessons.js?v=14"></script>
  <script src="pictures/lighthouse.js?v=14"></script>
  <script src="pictures/campsite.js?v=14"></script>
  <script src="pictures/seaside.js?v=14"></script>
  <script src="pictures/village.js?v=14"></script>
  <script src="pictures/fox.js?v=14"></script>
  <script src="pictures/owlpink.js?v=14"></script>
  <script src="pictures/treehouse.js?v=14"></script>
  <script src="pictures/bakery.js?v=14"></script>
  <script src="pictures/dumplings.js?v=14"></script>
  <script src="pictures/ramen.js?v=14"></script>
  <script src="pictures/desserts.js?v=14"></script>
  <script src="pictures/blossom.js?v=14"></script>
  <script src="pictures/reef.js?v=14"></script>
  <script src="pictures/balloons.js?v=14"></script>
  <script src="pictures/glasses.js?v=14"></script>
  <script src="pictures/raincoat.js?v=14"></script>
  <script src="pictures/teddy.js?v=14"></script>
  <script src="pictures/capybara.js?v=14"></script>
  <script src="pictures/tabby.js?v=14"></script>
  <script src="pictures/jester.js?v=14"></script>
  <script src="pictures/castle.js?v=14"></script>
  <script src="pictures/animeboy.js?v=14"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
