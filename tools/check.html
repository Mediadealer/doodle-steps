<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doodle Steps picture check</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; color: #222; background: #fafafa; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  #summary { font-weight: 700; margin-bottom: 12px; }
  .pic { display: grid; grid-template-columns: 300px 1fr; gap: 14px; padding: 12px; margin-bottom: 14px; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
  .pic svg { width: 100%; height: auto; border-radius: 6px; display: block; }
  .pic h2 { font-size: 16px; margin: 0 0 6px; }
  .err { color: #b00020; } .warn { color: #8a5a00; } .ok { color: #1a7f37; }
  ul { margin: 4px 0; padding-left: 18px; }
  .film { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .film figure { margin: 0; font-size: 11px; }
  .film svg { border: 1px solid #ddd; }
</style>
</head>
<body>
<h1>Doodle Steps picture check</h1>
<p>Add <code>?id=one,two</code> to check only those pictures and to see every step of them.</p>
<div id="summary">Checking…</div>
<div id="out"></div>

<script>
// Loads the same picture files the app loads (read from ../index.html), then
// for every step checks: can it be scored, is it still visible at the end,
// and does it differ from the color underneath it.
(async () => {
  const S = 300, SK = S / 600;
  const want = (new URLSearchParams(location.search).get('id') || '').split(',').filter(Boolean);

  const html = await (await fetch('../index.html', { cache: 'reload' })).text();
  const srcs = [...html.matchAll(/<script src="([^"]+)"/g)].map(m => m[1]).filter(s => !s.startsWith('app.js'));
  for (const src of srcs) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = '../' + src.split('?')[0] + '?t=' + Date.now();
      s.onload = res; s.onerror = () => { document.getElementById('out').insertAdjacentHTML('beforebegin', '<p class="err">Could not load ' + src + '</p>'); res(); };
      document.head.append(s);
    });
  }

  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  function mask(step) {
    cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, S, S); cx.setTransform(SK, 0, 0, SK, 0, 0);
    cx.lineCap = cx.lineJoin = 'round';
    const p = new Path2D(step.d);
    if (step.line) { cx.lineWidth = step.line; cx.stroke(p); } else cx.fill(p);
    const d = cx.getImageData(0, 0, S, S).data, bits = new Uint8Array(S * S);
    let area = 0;
    for (let i = 0; i < bits.length; i++) if (d[i * 4 + 3] > 100) { bits[i] = 1; area++; }
    return { bits, area };
  }
  const shape = s => s.line
    ? `<path d="${s.d}" fill="none" stroke="${s.color}" stroke-width="${s.line}" stroke-linecap="round" stroke-linejoin="round"/>`
    : `<path d="${s.d}" fill="${s.color}"/>`;
  const svg = (l, upto) => `<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"><rect width="600" height="600" fill="${l.bg}"/>${l.steps.slice(0, upto).map(shape).join('')}</svg>`;

  let errors = 0, warnings = 0, shown = 0;
  const out = document.getElementById('out');

  for (const l of LESSONS) {
    if (want.length && !want.includes(l.id)) continue;
    shown++;
    const E = [], W = [];
    const owner = new Int16Array(S * S).fill(-1);
    const masks = l.steps.map(mask);
    const colorAt = i => (owner[i] < 0 ? l.bg : l.steps[owner[i]].color).toLowerCase();

    l.steps.forEach((s, k) => {
      const m = masks[k], at = `step ${k + 1} "${s.name}"`;
      if (m.area < (s.line ? 8 : 12)) { E.push(`${at}: too small to score. Make it bigger.`); return; }
      let same = 0;
      for (let i = 0; i < m.bits.length; i++) if (m.bits[i] && colorAt(i) === s.color.toLowerCase()) same++;
      if (same / m.area > 0.9) W.push(`${at}: same color as what is already under it, so it will not show.`);
      for (let i = 0; i < m.bits.length; i++) if (m.bits[i]) owner[i] = k;
    });
    const seen = new Float64Array(l.steps.length);
    for (let i = 0; i < owner.length; i++) if (owner[i] >= 0) seen[owner[i]]++;
    l.steps.forEach((s, k) => {
      if (masks[k].area >= 12 && seen[k] / masks[k].area < 0.2) W.push(`step ${k + 1} "${s.name}": ${Math.round(100 * seen[k] / masks[k].area)}% visible at the end. Later steps cover it.`);
    });

    errors += E.length; warnings += W.length;
    const div = document.createElement('div');
    div.className = 'pic';
    div.innerHTML = `<div>${svg(l, l.steps.length)}</div><div><h2>${l.id} — ${l.name} — ${l.steps.length} steps</h2>
      ${E.length || W.length ? '' : '<div class="ok">No problems found.</div>'}
      ${E.length ? `<ul class="err">${E.map(x => `<li>ERROR ${x}</li>`).join('')}</ul>` : ''}
      ${W.length ? `<ul class="warn">${W.map(x => `<li>WARNING ${x}</li>`).join('')}</ul>` : ''}</div>
      ${want.length ? `<div class="film">${l.steps.map((s, k) => `<figure>${svg(l, k + 1)}<figcaption>${k + 1}. ${s.name}</figcaption></figure>`).join('')}</div>` : ''}`;
    out.append(div);
  }
  document.getElementById('summary').textContent = `CHECK RESULT: ${shown} pictures, ${errors} errors, ${warnings} warnings`;
  window.CHECK = { pictures: shown, errors, warnings };
})().catch(e => { document.getElementById('summary').textContent = 'CHECK FAILED: ' + e.message; });
</script>
</body>
</html>
